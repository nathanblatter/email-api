services:
  # `app` is the edge (Caddy): it owns the Tailscale port and is what the
  # tunnel targets, so deploys can run two `api` containers side by side.
  app:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Tailscale-only, like imessage-api (8899) and flightdeck (4300).
      - "100.79.61.79:4500:4500"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    networks:
      - default

  # `api` is the Go service. No host port: only the edge reaches it. Scaled to
  # two during a deploy; the old one is retired once the new one is healthy.
  api:
    build: .
    image: email-api:latest
    restart: unless-stopped
    environment:
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      # The house postfix relay (docker-services) → Brevo. Same hop personal-site uses.
      SMTP_HOST: ${SMTP_HOST:-postfix}
      SMTP_PORT: ${SMTP_PORT:-25}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-Nathan Blatter <noreply@nathanblatter.com>}
      EMAIL_ALLOWED_FROM_DOMAINS: ${EMAIL_ALLOWED_FROM_DOMAINS:-nathanblatter.com}
      # Brevo free tier is 300 recipients/day; keep headroom for personal-site's own sends.
      EMAIL_DAILY_BUDGET: ${EMAIL_DAILY_BUDGET:-250}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
      # Outage paging through the iMessage bridge on the Mac Mini host.
      IMESSAGE_API_URL: ${IMESSAGE_API_URL:-http://100.79.61.79:8899}
      IMESSAGE_API_KEY: ${IMESSAGE_API_KEY}
      IMESSAGE_FALLBACK_RECIPIENT: ${IMESSAGE_FALLBACK_RECIPIENT}
      EMAIL_MAX_MESSAGE_MB: ${EMAIL_MAX_MESSAGE_MB:-10}
      EMAIL_MAX_UPLOAD_MB: ${EMAIL_MAX_UPLOAD_MB:-1024}
      EMAIL_SPOOL_MAX_AGE: ${EMAIL_SPOOL_MAX_AGE:-48h}
      # Large attachments → expiring download links served from MinIO (docker-services)
      # through the public listener on :4501, which the tunnel below exposes as
      # https://file.nathanblatter.com. Leave MINIO_* unset to disable links.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      EMAIL_FILES_BUCKET: ${EMAIL_FILES_BUCKET:-email-files}
      EMAIL_FILES_PUBLIC_URL: ${EMAIL_FILES_PUBLIC_URL:-https://file.nathanblatter.com}
      EMAIL_FILES_TTL: ${EMAIL_FILES_TTL:-720h}
      # Inbox: Cloudflare Email Routing → worker/ → POST /inbound (public listener).
      # Messages in Postgres (db created on first start), attachments + raw .eml in MinIO.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/email}
      EMAIL_INBOUND_SECRET: ${EMAIL_INBOUND_SECRET}
      EMAIL_INBOX_BUCKET: ${EMAIL_INBOX_BUCKET:-email-inbox}
      EMAIL_INBOX_NOTIFY: ${EMAIL_INBOX_NOTIFY:-true}
      # claude.ai / phone connector: OAuth + bearer-only /mcp on this hostname (tunnel → app:4500).
      EMAIL_PUBLIC_URL: ${EMAIL_PUBLIC_URL:-https://email.nathanblatter.com}
      TZ: America/Denver
    volumes:
      - spool:/data
    networks:
      - default
      - services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4500/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Public hostnames file.nathanblatter.com → app:4501 and
  # email.nathanblatter.com → app:4500 (both land on the edge).
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  spool:

networks:
  # Reach postfix and redis by service name on the shared infra network.
  services:
    external: true
    name: docker-services_default
