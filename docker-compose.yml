services:
  # `app` is the edge (Caddy): it owns the Tailscale port and is what the
  # tunnel targets, so deploys can run two `api` containers side by side.
  app:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Tailscale-only, like imessage-api (8899) and flightdeck (4300).
      - "100.79.61.79:4500:4500"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    networks:
      - default

  # `api` is the Go service. No host port: only the edge reaches it. Scaled to
  # two during a deploy; the old one is retired once the new one is healthy.
  api:
    build: .
    image: email-api:latest
    restart: unless-stopped
    environment:
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      # The house postfix relay (docker-services) → Brevo. Same hop personal-site uses.
      SMTP_HOST: ${SMTP_HOST:-postfix}
      SMTP_PORT: ${SMTP_PORT:-25}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-Nathan Blatter <noreply@nathanblatter.com>}
      EMAIL_ALLOWED_FROM_DOMAINS: ${EMAIL_ALLOWED_FROM_DOMAINS:-nathanblatter.com}
      # Domains sent through the Amazon SES API instead of postfix (DNS + DKIM in
      # Route 53: byuisresearch.com). They are allowed From domains implicitly.
      # IAM user email-api (ses:SendEmail as *@byuisresearch.com only).
      SES_DOMAINS: ${SES_DOMAINS}
      SES_REGION: ${SES_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${SES_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SES_AWS_SECRET_ACCESS_KEY}
      # Brevo free tier is 300 recipients/day; keep headroom for personal-site's own sends.
      EMAIL_DAILY_BUDGET: ${EMAIL_DAILY_BUDGET:-250}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/3}
      # Outage paging through the iMessage bridge on the Mac Mini host.
      IMESSAGE_API_URL: ${IMESSAGE_API_URL:-http://100.79.61.79:8899}
      IMESSAGE_API_KEY: ${IMESSAGE_API_KEY}
      IMESSAGE_FALLBACK_RECIPIENT: ${IMESSAGE_FALLBACK_RECIPIENT}
      EMAIL_MAX_MESSAGE_MB: ${EMAIL_MAX_MESSAGE_MB:-10}
      EMAIL_MAX_UPLOAD_MB: ${EMAIL_MAX_UPLOAD_MB:-1024}
      EMAIL_SPOOL_MAX_AGE: ${EMAIL_SPOOL_MAX_AGE:-48h}
      # Large attachments → expiring download links served from MinIO (docker-services)
      # through the public listener on :4501, which the tunnel below exposes as
      # https://file.nathanblatter.com. Leave MINIO_* unset to disable links.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      EMAIL_FILES_BUCKET: ${EMAIL_FILES_BUCKET:-email-files}
      EMAIL_FILES_PUBLIC_URL: ${EMAIL_FILES_PUBLIC_URL:-https://file.nathanblatter.com}
      EMAIL_FILES_TTL: ${EMAIL_FILES_TTL:-720h}
      # Inbox: Cloudflare Email Routing → worker/ → POST /inbound (public listener).
      # Messages in Postgres (db created on first start), attachments + raw .eml in MinIO.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/email}
      EMAIL_INBOUND_SECRET: ${EMAIL_INBOUND_SECRET}
      EMAIL_INBOX_BUCKET: ${EMAIL_INBOX_BUCKET:-email-inbox}
      EMAIL_INBOX_NOTIFY: ${EMAIL_INBOX_NOTIFY:-true}
      # claude.ai / phone connector: bearer-only /mcp on this hostname (tunnel → app:4500).
      # Tokens come from Squawk; Nathan approves each connector in its console.
      EMAIL_PUBLIC_URL: ${EMAIL_PUBLIC_URL:-https://email.nathanblatter.com}
      EMAIL_AUTH_ISSUER: ${EMAIL_AUTH_ISSUER:-https://squawk.nathanblatter.com}
      EMAIL_AUTH_SERVICE_ID: ${EMAIL_AUTH_SERVICE_ID}
      # Apple Mail setup page (https://email.nathanblatter.com/mail): the
      # public PKCE client registered at Squawk; empty = page disabled.
      EMAIL_MAIL_CLIENT_ID: ${EMAIL_MAIL_CLIENT_ID}
      TZ: America/Denver
    volumes:
      - spool:/data
    networks:
      - default
      - services
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4500/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # `bridge` is the SQS outbox consumer for auth-service (an AWS Lambda that
  # cannot reach the Tailscale-only keyed port). Same image, different
  # subcommand: long-polls the queue and replays each message as POST /send on
  # the edge with the `auth-service` key. Idles (no exit) when SQS_QUEUE_URL is unset.
  bridge:
    image: email-api:latest
    command: ["sqs-bridge"]
    restart: unless-stopped
    environment:
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${BRIDGE_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BRIDGE_AWS_SECRET_ACCESS_KEY}
      BRIDGE_API_URL: http://app:4500
      BRIDGE_API_KEY: ${BRIDGE_API_KEY}
      TZ: America/Denver
    # The image's HEALTHCHECK probes the HTTP server, which this process is not.
    healthcheck:
      disable: true
    depends_on:
      - app
    networks:
      - default

  # `inbound` receives byuisresearch.com: SES receiving stores each message in
  # S3 and notifies SNS → SQS; this loop fetches the object and POSTs it to
  # /inbound on the public listener (via the edge), exactly like the Cloudflare
  # Email Worker does for nathanblatter.com. Pull-based, so an outage here just
  # parks mail in SQS (14 days, DLQ after 5 failed receives).
  inbound:
    image: email-api:latest
    command: ["ses-inbound"]
    restart: unless-stopped
    environment:
      INBOUND_SQS_QUEUE_URL: ${INBOUND_SQS_QUEUE_URL}
      SES_REGION: ${SES_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${SES_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SES_AWS_SECRET_ACCESS_KEY}
      INBOUND_API_URL: http://app:4501
      EMAIL_INBOUND_SECRET: ${EMAIL_INBOUND_SECRET}
      TZ: America/Denver
    healthcheck:
      disable: true
    depends_on:
      - app
    networks:
      - default

  # `mailgw` is the IMAP + SMTP-submission gateway for Apple Mail
  # (internal/imapd). Public edge: the Hetzner VPS terminates nothing; it
  # forwards :993/:465 over the tailnet with a PROXY v2 header to these
  # Tailscale-only ports, and TLS for mail.nathanblatter.com terminates here
  # (Let's Encrypt via Cloudflare DNS-01, kept in the mailcerts volume).
  # Single instance: it holds the mailboxes in memory and writes through to
  # Postgres. A deploy restarts it; Mail reconnects on its own.
  mailgw:
    image: email-api:latest
    command: ["mail-gateway"]
    restart: unless-stopped
    ports:
      - "100.79.61.79:1993:1993"
      - "100.79.61.79:1465:1465"
    environment:
      MAIL_ADDRESS: ${MAIL_ADDRESS:-nathan@nathanblatter.com}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.nathanblatter.com}
      MAIL_SEND_URL: http://app:4500
      MAIL_SEND_KEY: ${MAIL_GATEWAY_API_KEY}
      MAIL_ACME_EMAIL: ${MAIL_ACME_EMAIL:-nathan@nathanblatter.com}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/email}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      EMAIL_INBOX_BUCKET: ${EMAIL_INBOX_BUCKET:-email-inbox}
      TZ: America/Denver
    volumes:
      - mailcerts:/data
    healthcheck:
      disable: true
    depends_on:
      - app
    networks:
      - default
      - services

  # Public hostnames file.nathanblatter.com → app:4501 and
  # email.nathanblatter.com → app:4500 (both land on the edge).
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  spool:
  mailcerts:

networks:
  # Reach postfix and redis by service name on the shared infra network.
  services:
    external: true
    name: docker-services_default
