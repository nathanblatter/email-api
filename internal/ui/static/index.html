<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail — nathanblatter.com</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232457C5'/%3E%3Cpath d='M7 11h18v11H7z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M7 11l9 7 9-7' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app" hidden>
  <nav class="rail" aria-label="Mailboxes">
    <div class="rail-brand">
      <span class="rail-domain">nathanblatter.com</span>
    </div>
    <button class="compose" id="compose-btn" type="button">Write</button>
    <ul class="boxes" role="list">
      <li><button class="box is-active" data-box="inbox" type="button"><span>Inbox</span><span class="count" id="count-unread"></span></button></li>
      <li><button class="box" data-box="unread" type="button"><span>Unread</span></button></li>
      <li><button class="box" data-box="suspicious" type="button"><span>Suspicious</span></button></li>
    </ul>
    <div class="rail-foot">
      <div class="health" id="health" title="Gateway health">…</div>
      <button class="link" id="signout" type="button">Change key</button>
    </div>
  </nav>

  <section class="list" aria-label="Messages">
    <div class="list-head">
      <input id="search" class="search" type="search" placeholder="Search sender, subject or text" autocomplete="off" spellcheck="false">
      <button class="icon" id="refresh" type="button" title="Refresh (R)" aria-label="Refresh">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6"/><path d="M16.5 3v3.5H13"/></svg>
      </button>
    </div>
    <ol id="messages" class="messages" role="list"></ol>
    <div class="list-foot">
      <button class="link" id="more" type="button" hidden>Show older</button>
      <p class="empty" id="empty" hidden></p>
    </div>
  </section>

  <section class="reader" id="reader" aria-live="polite">
    <div class="reader-blank" id="reader-blank">
      <p>Pick a message to read it here.</p>
      <p class="keys"><kbd>j</kbd><kbd>k</kbd> move <kbd>↵</kbd> open <kbd>r</kbd> reply <kbd>u</kbd> unread <kbd>#</kbd> delete <kbd>/</kbd> search</p>
    </div>
    <article class="message" id="message" hidden>
      <header class="message-head">
        <button class="back link" id="back" type="button">← Inbox</button>
        <h1 class="subject" id="m-subject"></h1>
        <div class="meta">
          <div class="who">
            <span class="from" id="m-from"></span>
            <span class="to" id="m-to"></span>
          </div>
          <div class="when">
            <time id="m-date"></time>
            <span class="auth" id="m-auth"></span>
          </div>
        </div>
        <div class="actions">
          <button type="button" id="reply" class="primary">Reply</button>
          <button type="button" id="unread">Mark unread</button>
          <button type="button" id="view-toggle" hidden>View as text</button>
          <button type="button" id="delete" class="danger">Delete</button>
        </div>
      </header>
      <div class="notice" id="images-notice" hidden>
        <span>Remote images are blocked.</span>
        <button type="button" class="link" id="load-images">Load images</button>
      </div>
      <div class="body" id="m-body"></div>
      <ul class="attachments" id="m-attachments" role="list"></ul>
      <details class="headers">
        <summary>Headers</summary>
        <dl id="m-headers"></dl>
      </details>
    </article>
  </section>
</div>

<dialog id="key-dialog" class="dialog">
  <form method="dialog" id="key-form">
    <h2>Mail for nathanblatter.com</h2>
    <p>Enter the email-api key to open the inbox. It stays in this browser only.</p>
    <input id="key-input" type="password" autocomplete="current-password" placeholder="API key" required>
    <p class="error" id="key-error" hidden></p>
    <div class="dialog-actions"><button type="submit" class="primary">Open inbox</button></div>
  </form>
</dialog>

<dialog id="compose" class="dialog compose-dialog">
  <form id="compose-form">
    <div class="compose-head">
      <h2 id="compose-title">New message</h2>
      <button type="button" class="icon" id="compose-close" aria-label="Close">✕</button>
    </div>
    <label class="field"><span>From</span>
      <span class="from-field"><input id="c-from-local" type="text" value="nathan" required pattern="[A-Za-z0-9._+-]+"><span>@nathanblatter.com</span></span>
    </label>
    <label class="field"><span>To</span><input id="c-to" type="text" placeholder="name@example.com, other@example.com" required></label>
    <label class="field"><span>Cc</span><input id="c-cc" type="text"></label>
    <label class="field"><span>Subject</span><input id="c-subject" type="text" required></label>
    <textarea id="c-body" rows="12" required></textarea>
    <div class="compose-foot">
      <label class="files"><input id="c-files" type="file" multiple><span>Attach files</span></label>
      <span id="c-files-list" class="files-list"></span>
      <span class="spacer"></span>
      <p class="error" id="c-error" hidden></p>
      <button type="submit" class="primary" id="c-send">Send</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
