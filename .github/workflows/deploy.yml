name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recreate_edge:
        description: "Recreate the Caddy edge container (brief port blip; only when its image/compose config changed)"
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          # Deploy from a dedicated checkout, never from the dev working tree in ~/dev.
          cd /Users/nathanblatter/deploy/email-api
          git fetch origin main
          git reset --hard origin/main

          # Build = test gate: the Dockerfile runs gofmt, go vet and go test
          # before compiling, so a red suite never produces an image.
          docker compose build --build-arg VERSION="${GITHUB_SHA::7}" api

          # Edge + tunnel: never recreated by a routine deploy (that would drop
          # the port). A changed Caddyfile is hot-reloaded instead.
          if [ "${{ inputs.recreate_edge }}" = "true" ]; then
            echo "Recreating edge (requested)"
            docker compose up -d --force-recreate app
          else
            docker compose up -d --no-recreate app tunnel
            docker compose exec -T app caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || echo "caddy reload skipped"
          fi

          # Zero-downtime: run the new api beside the old one, switch once the
          # new one is healthy, then retire the old. The edge round-robins by
          # Docker DNS and retries a refused connect, so no request is dropped.
          OLD_CONTAINER=$(docker compose ps -q api 2>/dev/null | head -1)
          if [ -z "$OLD_CONTAINER" ]; then
            echo "No existing api container, starting fresh..."
            docker compose up -d api
            NEW_CONTAINER=$(docker compose ps -q api | head -1)
          else
            docker compose up -d --scale api=2 --no-recreate api
            NEW_CONTAINER=$(docker compose ps -q api | grep -v "^${OLD_CONTAINER}$" | head -1)
            if [ -z "$NEW_CONTAINER" ]; then echo "ERROR: could not identify new container"; exit 1; fi
          fi
          echo "Old: ${OLD_CONTAINER:-none} | New: $NEW_CONTAINER"

          echo "Waiting for the new container to be healthy..."
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$NEW_CONTAINER" 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "Healthy. Deployed ${GITHUB_SHA::7}."
              if [ -n "$OLD_CONTAINER" ]; then
                docker stop "$OLD_CONTAINER" >/dev/null && docker rm "$OLD_CONTAINER" >/dev/null
                echo "Old container retired."
              fi
              docker image prune -f --filter label=none >/dev/null 2>&1 || true

              # Inbound Email Worker. Token + secret come from the host .env, never from GitHub.
              export CLOUDFLARE_API_TOKEN=$(grep -E '^CLOUDFLARE_API_TOKEN=' .env | cut -d= -f2-)
              export CLOUDFLARE_ACCOUNT_ID=$(grep -E '^CLOUDFLARE_ACCOUNT_ID=' .env | cut -d= -f2-)
              INBOUND_SECRET=$(grep -E '^EMAIL_INBOUND_SECRET=' .env | cut -d= -f2-)
              if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$INBOUND_SECRET" ]; then
                export PATH=/opt/homebrew/opt/node@24/bin:/opt/homebrew/bin:$PATH
                cd worker && npm ci --silent
                npx wrangler deploy
                printf '%s' "$INBOUND_SECRET" | npx wrangler secret put INBOUND_SECRET
                echo "Email Worker deployed."
              else
                echo "Skipping worker deploy (CLOUDFLARE_API_TOKEN / EMAIL_INBOUND_SECRET unset)."
              fi
              exit 0
            elif [ "$STATUS" = "unhealthy" ]; then
              break
            fi
            echo "  status: ${STATUS:-starting} ($i/24)"
            sleep 5
          done

          echo "ERROR: new container never became healthy; keeping the old one"
          docker logs --tail 50 "$NEW_CONTAINER" || true
          docker stop "$NEW_CONTAINER" >/dev/null && docker rm "$NEW_CONTAINER" >/dev/null
          exit 1
