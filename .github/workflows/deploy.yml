name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          # Deploy from a dedicated checkout, never from the dev working tree in ~/dev.
          cd /Users/nathanblatter/deploy/email-api
          git fetch origin main
          git reset --hard origin/main

          # Keep the current image as a rollback target.
          if docker image inspect email-api:latest >/dev/null 2>&1; then
            docker tag email-api:latest email-api:previous
          fi

          # Build = test gate: the Dockerfile runs gofmt, go vet and go test
          # before compiling, so a red suite never produces an image.
          docker compose build --build-arg VERSION="${GITHUB_SHA::7}" app

          # Single replica (it binds a host port), so this is a recreate with
          # a health gate and automatic rollback rather than blue/green.
          # Brings up the tunnel sidecar too (it only starts after app).
          docker compose up -d

          echo "Waiting for the new container to be healthy..."
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "Healthy. Deployed ${GITHUB_SHA::7}."
              docker image prune -f --filter label=none >/dev/null 2>&1 || true
              exit 0
            fi
            echo "  status: ${STATUS:-starting} ($i/24)"
            sleep 5
          done

          echo "ERROR: new container never became healthy; rolling back"
          docker logs --tail 50 "$(docker compose ps -q app)" || true
          if docker image inspect email-api:previous >/dev/null 2>&1; then
            docker tag email-api:previous email-api:latest
            docker compose up -d --no-build app
          fi
          exit 1
